[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egoqc-lite"
version = "0.7.0"
description = "Low-cost, incremental quality gates for LeRobot v3 egocentric hand datasets."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.24,<3",
  "pyarrow>=12,<22",
  "av>=12,<17",
  "pillow>=10,<12",
]

[project.optional-dependencies]
hand = [
  "ultralytics==8.4.115",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
egodex = [
  "h5py>=3.8,<4",
]
vla = [
  "torch>=2.0",
]
mano = [
  "torch>=2.0",
  "smplx==0.1.28",
  "chumpy @ git+https://github.com/mattloper/chumpy@580566eafc9ac68b2614b64d6f7aaa84eebb70da",
]
vitra = [
  "opencv-contrib-python-headless>=4.8,<5",
  "ffmpeg-python>=0.2,<1",
  "projectaria-tools>=2.1,<3",
]

[project.scripts]
egoqc = "egoqc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
egoqc = ["default.json"]
