[program:egoqc-review]
directory=/srv/egoqc/app
command=/srv/egoqc/app/deploy/run-egoqc-review.sh
environment=DATABASE_URL="postgresql:///egoqc?user=egoqc"
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/srv/egoqc/results/egoqc-review.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true
